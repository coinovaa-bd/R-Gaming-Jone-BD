<style>
:root{--g:#edc45d;--g2:#9e7628;--bg:#080808;--card:#171717;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#211a0c 0,#090909 48%);color:#fff;font-family:system-ui,Arial,sans-serif;min-height:100vh}header{position:sticky;top:0;z-index:4;background:#0b0b0bf2;border-bottom:1px solid #60491d;padding:12px 15px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand img{width:47px;height:47px;object-fit:cover;border-radius:50%;border:1px solid #8f6b25}.brand b{display:block;color:var(--g);letter-spacing:1.5px;font-size:17px}.brand small{color:#aaa;letter-spacing:2px;font-size:9px}.crown{color:var(--g);font-size:25px}main{max-width:900px;margin:auto;padding:14px}.hero{border:1px solid #70551f;border-radius:17px;padding:18px;background:linear-gradient(120deg,#2a210e,#101010 70%);box-shadow:0 8px 28px #0008}.hero h1{margin:0;color:var(--g);font-size:23px}.hero p{margin:7px 0 0;color:#c9c1ae;font-size:12px;line-height:1.5}.stats{display:flex;gap:8px;margin-top:14px}.stat{flex:1;background:#090909aa;border:1px solid #4b3a1c;border-radius:10px;padding:9px;text-align:center}.stat strong{display:block;color:var(--g);font-size:17px}.stat small{color:#aaa;font-size:10px}.heading{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 11px}.heading h2{font-size:17px;color:var(--g);margin:0}.heading span{font-size:10px;color:#aaa}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.game{padding:0;border:1px solid #393124;border-radius:14px;background:linear-gradient(145deg,#1d1b17,#101010);overflow:hidden;color:white;text-align:left;min-width:0}.game:active{transform:scale(.98)}.art{height:91px;display:grid;place-items:center;font-size:43px;background:radial-gradient(circle at 50% 35%,#5b451a,#1b160c 65%);border-bottom:1px solid #403117}.meta{padding:9px 10px 11px}.meta b{font-size:12px;display:block}.meta small{font-size:10px;color:#aa #screen{display:none;position:fixed;inset:0;z-index:8;background:#090909;overflow:auto;padding:12px 13px 24px}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.bar h2{font-size:16px;color:var(--g);margin:0;text-align:center;flex:1}.btn{background:linear-gradient(#33270f,#171208);border:1px solid #9a742d;color:#ffdc83;border-radius:10px;padding:11px 14px;font-weight:700;font-size:13px}.btn:active{filter:brightness(1.35)}.stage{border:1px solid #57441f;border-radius:13px;background:#121212;min-height:300px;padding:10px;position:relative;overflow:hidden}.hint{text-align:center;color:#aaa;font-size:11px;line-height:1.5;margin:10px 3px}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}.score{color:var(--g);text-align:center;font-size:20px;font-weight:800;margin:6px}.arena{display:block;width:100%;height:auto;max-height:58vh;background:#18261a;border-radius:9px;touch-action:none}.tilegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tile{font-size:26px;padding:10px 0;min-height:52px}.bigemoji{text-align:center;font-size:72px;padding:30px 0}.track{height:330px;max-width:310px;margin:auto;background:repeating-linear-gradient(0deg,#555 0 32px,#444 32px 64px);border-left:65px solid #777;border-right:65px solid #777;position:relative;border-radius:10px}.player{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:34px}.obstacle{position:absolute;font-size:27px}.board{display:grid;grid-template-columns:repeat(8,1fr);max-width:420px;margin:auto;border:2px solid #9d772e}.sq{border-radius:0;padding:5px 0;font-size:clamp(18px,5vw,29px);aspect-ratio:1;color:#17120a}.sq.light{background:#ead9b5}.sq.dark{background:#927044}.selected{outline:3px solid #ffd65e;z-index:1}.target{width:62px;height:62px;border-radius:50%;font-size:32px;display:grid;place-items:center;position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:#503a11;border:2px solid var(--g)}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.art{height:115px}}
</style></head><body>
<header><div class="brand"><img src="royal_logo.png" alt="R Gaming logo"><div><b>R GAMING JONE BD</b><small>PLAY • ENJOY • WIN</small></div></div><div class="crown">♛</div></header>
<main id="home"><section class="hero"><h1>Welcome, Gamer! 👑</h1><p>১৫টি Offline Mini Game এক জায়গায়। পছন্দের গেম বেছে নাও, নিজের স্কোর বাড়াও এবং মজা করো।</p><div class="stats"><div class="stat"><strong>15</strong><small>GAMES</small></div><div class="stat"><strong>FREE</strong><small>PLAY</small></div><div class="stat"><strong>OFFLINE</strong><small>MODE</small></div></div></section><div class="heading"><h2>🎮 ALL GAMES</h2><span>SELECT & PLAY</span></div><div class="grid" id="grid"></div><div class="foot">R GAMING JONE BD • VERSION 1.0<br>All games are offline mini-game editions.</div></main>
<section id="screen"><div class="bar"><button class="btn" onclick="home()">← HOME</button><h2 id="title">GAME</h2><button class="btn" onclick="restart()">↻ AGAIN</button></div><div id="stage" class="stage"></div><div id="hint" class="hint"></div><div id="controls" class="controls"></div></section>
<script>
const G=[['Battle Royale','🏝️','শেষ পর্যন্ত টিকে থাকো'],['Car Racing','🏎️','গাড়ি চালিয়ে বাধা এড়াও'],['Zombie Survival','🧟','জম্বিদের থামাও'],['Football Challenge','⚽','গোল করার চেষ্টা করো'],['Sniper Mission','🎯','টার্গেটে নিশানা করো'],['Bike Racing','🏍️','বাইক রেসে এগিয়ে যাও'],['Shadow Fight','🥷','প্রতিপক্ষকে হারাও'],['Bubble Shooter','🫧','একই রঙের বল মেলাও'],['Endless Run','🏃','বাধা পার হয়ে দৌড়াও'],['Car Parking','🚘','গাড়ি পার্ক করো'],['Chess Master','♟️','দাবার চাল দাও'],['Fruit Slicer','🍉','ফল কাটো'],['Air Combat','✈️','আকাশে শত্রু এড়াও'],['8 Ball Pool','🎱','বল পকেটে ফেলো'],['Monster Truck','🚙','স্টান্ট ও রেস করো']];
const grid=document.getElementById('grid');G.forEach((g,i)=>{let b=document.createElement('button');b.className='game';b.innerHTML=`<div class="art">${g[1]}</div><div class="meta"><b>${i+1}. ${g[0]}</b><small>${g[2]}</small><span class="playtag">▶ PLAY NOW</span></div>`;b.onclick=()=>open(i);grid.appendChild(b)});
let idx=0,timer=null,raf=0,score=0,cleanupFn=()=>{};const $=id=>document.getElementById(id),stage=$('stage'),controls=$('controls');function clean(){clearInterval(timer);cancelAnimationFrame(raf);timer=null;raf=0;window.onkeydown=null;cleanupFn();cleanupFn=()=>{}}function home(){clean();$('screen').style.display='none';$('home').style.display='block'}function restart(){open(idx)}function say(s){$('hint').textContent=s}function buttons(arr){controls.innerHTML='';arr.forEach(([label,fn])=>{let b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=fn;controls.appendChild(b)})}function open(i){clean();idx=i;$('home').style.display='none';$('screen').style.display='block';$('title').textContent=G[i][0];stage.innerHTML='';controls.innerHTML='';$('hint').textContent='';[battle,racing,zombie,football,sniper,bike,fight,bubble,runner,parking,chess,fruit,air,pool,truck][i]()}
function canvas(bg='#17251a'){stage.innerHTML='<canvas class="arena" id="cv" width="720" height="480"></canvas>';let c=$('cv'),x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,720,480);return [c,x]}
function battle(){let [c,x]=canvas('#23452c'),p={x:360,y:240,hp:100},en=Array.from({length:7},()=>({x:35+Math.random()*650,y:35+Math.random()*410,h:2,alive:true})),shots=[],keys={},frame=0,k=0;function fire(){shots.push({x:p.x,y:p.y-10})}window.onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')fire()};window.onkeyup=e=>keys[e.key.toLowerCase()]=0;buttons([['◀',()=>p.x-=22],['▲',()=>p.y-=22],['▼',()=>p.y+=22],['▶',()=>p.x+=22],['FIRE',fire]]);say('Arrow/WASD বা বাটন দিয়ে নড়ো, FIRE দিয়ে গুলি করো।');function loop(){frame++;x.fillStyle='#23452c';x.fillRect(0,0,720,480);x.strokeStyle='#d9bb62';x.lineWidth=4;x.beginPath();x.arc(360,240,Math.max(85,220-frame*.035),0,7);x.stroke();if(keys.a||keys.arrowleft)p.x-=2.7;if(keys.d||keys.arrowright)p.x+=2.7;if(keys.w||keys.arrowup)p.y-=2.7;if(keys.s||keys.arrowdown)p.y+=2.7;p.x=Math.max(12,Math.min(708,p.x));p.y=Math.max(12,Math.min(468,p.y));if(keys[' ']&&frame%12===0)fire();shots.forEach(s=>{s.y-=8;x.fillStyle='#ffe071';x.fillRect(s.x-3,s.y,6,12)});shots=shots.filter(s=>s.y>0);en.forEach(e=>{if(!e.alive)return;let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*.55;e.y+=dy/d*.55;x.fillStyle='#d34e40';x.beginPath();x.arc(e.x,e.y,13,0,7);x.fill();shots.forEach(s=>{if(Math.hypot(s.x-e.x,s.y-e.y)<17){e.h--;s.y=-20;if(e.h<=0){e.alive=false;k++}}});if(d<22&&frame%35===0)p.hp-=5});x.fillStyle='#f5cf62';x.beginPath();x.arc(p.x,p.y,14,0,7);x.fill();x.fillStyle='white';x.font='18px Arial';x.fillText('HP '+p.hp+'   KILLS '+k,15,25);if(p.hp<=0||en.every(e=>!e.alive)){clean();say(p.hp<=0?'GAME OVER • Eliminations: '+k:'ROYAL CHAMPION! • Eliminations: '+k);return}raf=requestAnimationFrame(loop)}loop();cleanupFn=()=>{} }
function racing(){roadGame('🏎️',5,'রেসিং: LEFT / RIGHT দিয়ে গাড়ি সরাও।')}
function bike(){roadGame('🏍️',6,'বাইক রেস: LEFT / RIGHT দিয়ে বাধা এড়াও।')}
function air(){roadGame('✈️',4,'বিমান চালাও, LEFT / RIGHT দিয়ে শত্রু এড়াও।')}
function truck(){roadGame('🚙',4,'ট্রাক চালাও, JUMP দিয়ে বাধা পার হও।')}
function roadGame(icon,speed,msg){stage.innerHTML='<div class="score" id="sc">SCORE 0</div><div class="track" id="track"><div class="player" id="pl">'+icon+'</div></div>';let lane=1,obs=[],n=0,alive=true;function move(d){lane=Math.max(0,Math.min(2,lane+d));$('pl').style.left=(lane*50+0)+'%'}buttons([['◀ LEFT',()=>move(-1)],['JUMP',()=>{ $('pl').style.bottom='95px';setTimeout(()=>$('pl').style.bottom='22px',450)}],['RIGHT ▶',()=>move(1)]]);say(msg);timer=setInterval(()=>{if(!alive)return;n++;if(n%12===0){let l=Math.floor(Math.random()*3),o=document.createElement('div');o.className='obstacle';o.textContent='🪨';o.style.left=(l*50)+'%';o.style.top='-28px';$('track').appendChild(o);obs.push({el:o,l,y:-28})}obs.forEach(o=>{o.y+=speed;o.el.style.top=o.y+'px';if(o.y>265&&o.y<320&&o.l===lane){alive=false;clearInterval(timer);say('ধাক্কা! তোমার স্কোর: '+Math.floor(n/2))}if(o.y>340)o.el.remove()});obs=obs.filter(o=>o.y<360);$('sc').textContent='SCORE '+Math.floor(n/2)},60)}
function zombie(){tapTargets('🧟','Tap zombies দ্রুত! ২৫ সেকেন্ডে যত বেশি ধরতে পারো।',25)}
function football(){stage.innerHTML='<div class="bigemoji">🥅</div><div class="score" id="sc">GOALS 0</div><div class="target" id="target">⚽</div>';let goals=0;function kick(){let t=$('target');let good=Math.random()>.38;if(good){goals++;t.textContent='🥅';say('GOAL! দারুণ শট!')}else{t.textContent='🧤';say('সেভ করেছে! আবার চেষ্টা করো।')}$('sc').textContent='GOALS '+goals;setTimeout(()=>{if($('target'))$('target').textContent='⚽'},450)}buttons([['KICK ⚽',kick]]);say('KICK চাপ দিয়ে পেনাল্টি শট নাও।')}
function sniper(){stage.innerHTML='<div class="score" id="sc">HITS 0</div><div style="height:260px;position:relative;background:linear-gradient(#24364a,#111);border-radius:10px" id="field"><button class="target" id="target">🎯</button></div>';let hits=0;function spawn(){let t=$('target');if(!t)return;t.style.left=(12+Math.random()*76)+'%';t.style.top=(15+Math.random()*65)+'%';t.onclick=()=>{hits++;$('sc').textContent='HITS '+hits;spawn()}}spawn();say('লক্ষ্যবস্তুর ওপর ট্যাপ করে পয়েন্ট নাও।')}
function fight(){stage.innerHTML='<div class="bigemoji">🥷　⚔️　🥷</div><div class="score" id="sc">YOU 100 HP • ENEMY 100 HP</div><div style="height:16px;background:#441;border-radius:9px;overflow:hidden"><div id="hp" style="height:100%;width:100%;background:#d44"></div></div>';let you=100,enemy=100;buttons([['👊 PUNCH',()=>hit(12)],['🦵 KICK',()=>hit(18)],['🛡️ BLOCK',()=>{you=Math.min(100,you+4);say('তুমি আঘাত ঠেকিয়েছ!')}]]);function hit(d){enemy-=d;you-=Math.random()*13|0;$('sc').textContent='YOU '+you+' HP • ENEMY '+Math.max(0,enemy)+' HP';$('hp').style.width=Math.max(0,enemy)+'%';if(enemy<=0)say('তুমি জিতেছ!');else if(you<=0)say('তুমি হেরেছ। AGAIN চাপো।');else say('লড়াই চালিয়ে যাও!')}}
function bubble(){let colors=['🔴','🟡','🔵','🟢','🟣'],arr=Array.from({length:30},()=>colors[Math.random()*5|0]),pts=0;stage.innerHTML='<div class="score" id="sc">SCORE 0</div><div class="tilegrid" id="tiles"></div>';let box=$('tiles');function draw(){box.innerHTML='';arr.forEach((v,i)=>{let b=document.createElement('button');b.className='btn tile';b.textContent=v||' ';b.onclick=()=>{if(!arr[i])return;let same=arr[i];let neighbours=[i-5,i+5,i-1,i+1].filter(j=>j>=0&&j<arr.length&&Math.abs((j%5)-(i%5))<2);let group=[i,...neighbours.filter(j=>arr[j]===same)];if(group.length<2){say('পাশের একই রঙের বল বেছে নাও।');return}group.forEach(j=>arr[j]='');pts+=group.length*10;$('sc').textContent='SCORE '+pts;draw();if(arr.every(x=>!x))say('সব বল পরিষ্কার! তুমি জিতেছ!')};box.appendChild(b)})}draw();say('পাশাপাশি একই রঙের বল ট্যাপ করে মিলাও।')}
function runner(){stage.innerHTML='<div class="score" id="sc">DISTANCE 0</div><div style="height:290px;background:linear-gradient(#1b2938,#284322);position:relative;border-radius:10px;overflow:hidden"><div id="runner" style="position:absolute;bottom:20px;left:35%;font-size:42px">🏃</div><div id="rock" style="position:absolute;bottom:20px;right:-40px;font-size:30px">🪨</div></div>';let jump=false,d=0,ob=100;buttons([['JUMP 🦘',()=>{jump=true;$('runner').style.bottom='125px';setTimeout(()=>{jump=false;if($('runner'))$('runner').style.bottom='20px'},600)}]]);timer=setInterval(()=>{d++;ob-=5;if(ob<0)ob=100;$('rock').style.right=(100-ob)+'%';$('sc').textContent='DISTANCE '+d;if(ob>58&&ob<70&&!jump){clearInterval(timer);say('বাধায় ধাক্কা! দূরত্ব: '+d)}},100);say('JUMP বাটন দিয়ে পাথর পার হও।')}
function parking(){stage.innerHTML='<div class="score">PARKING CHALLENGE</div><div style="height:260px;background:#303030;border:3px dashed #aaa;border-radius:10px;position:relative"><div style="position:absolute;right:12px;top:75px;width:95px;height:85px;border:3px solid #e8c45e;border-radius:8px"></div><div id="car" style="position:absolute;left:12px;top:100px;font-size:40px">🚘</div></div>';let pos=12;buttons([['◀',()=>{pos=Math.max(0,pos-12);$('car').style.left=pos+'px'}],['▶',()=>{pos=Math.min(220,pos+12);$('car').style.left=pos+'px'}],['PARK',()=>say(pos>185&&pos<235?'PERFECT PARKING!':'আরও কাছে গিয়ে পার্ক করো।')]]);say('গাড়িকে হলুদ পার্কিং বক্সে নাও।')}
function chess(){let p=['♜','♞','♝','♛','♚','♝','♞','♜','♟','♟','♟','♟','♟','♟','♟','♟','','','','','','','', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '♙','♙','♙','♙','♙','♙','♙','♙','♖','♘','♗','♕','♔','♗','♘','♖'];stage.innerHTML='<div class="score">CHESS BOARD</div><div class="board" id="board"></div>';let sel=-1,board=$('board');function draw(){board.innerHTML='';p.forEach((v,i)=>{let b=document.createElement('button');b.className='sq '+((Math.floor(i/8)+i%8)%2?'dark':'light')+(sel===i?' selected':'');b.textContent=v;b.onclick=()=>{if(sel<0&&v){sel=i;draw()}else if(sel>=0){p[i]=p[sel];p[sel]='';sel=-1;draw();say('চাল দেওয়া হয়েছে। এটি basic free-move chess board।')}};board.appendChild(b)})}draw();say('একটি ঘুঁটি বেছে অন্য ঘরে ট্যাপ করো।')}
function fruit(){tapTargets('🍉','ফলগুলোতে ট্যাপ করে কাটো। ৩০ সেকেন্ডে স্কোর বাড়াও।',30)}
function tapTargets(icon,msg,seconds){stage.innerHTML='<div class="score" id="sc">SCORE 0</div><div style="height:270px;position:relative;background:linear-gradient(#172a35,#243b1f);border-radius:10px" id="field"><button class="target" id="target">'+icon+'</button></div>';let pts=0,left=seconds;function move(){let t=$('target');if(!t)return;t.style.left=(10+Math.random()*80)+'%';t.style.top=(12+Math.random()*72)+'%'}$('target').onclick=()=>{pts++;$('sc').textContent='SCORE '+pts;move()};timer=setInterval(()=>{left--;say(msg+' সময়: '+left);if(left<=0){clearInterval(timer);say('সময় শেষ! স্কোর: '+pts)}},1000);move()}
function pool(){stage.innerHTML='<div class="score" id="sc">POCKETS 0</div><div style="height:270px;background:#17623d;border:9px solid #70491e;border-radius:15px;position:relative" id="table"><div id="balls" style="position:absolute;inset:0"></div></div>';let pts=0;let balls=$('balls');for(let i=0;i<7;i++){let b=document.createElement('button');b.textContent=['⚪','🟡','🔴','🔵','🟣','🟠','⚫'][i];b.style.cssText=`position:absolute;left:${12+Math.random()*75}%;top:${12+Math.random()*72}%;font-size:24px;background:transparent;border:0;padding:0`;b.onclick=()=>{b.remove();pts++;$('sc').textContent='POCKETS '+pts;if(!balls.children.length)say('TABLE CLEAR!')};balls.appendChild(b)}buttons([['SHOT',()=>say('বলগুলোতে ট্যাপ করে পকেটে ফেলো।')]]);say('যেকোনো বল ট্যাপ করে পকেট করো।')}
</script></body></html>
